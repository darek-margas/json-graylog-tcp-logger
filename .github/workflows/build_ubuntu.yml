name: Build packages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 20.04
            image: "ubuntu:20.04"
            slug: ubuntu20.04
          - name: Ubuntu 22.04
            image: "ubuntu:22.04"
            slug: ubuntu22.04
          - name: Ubuntu 24.04
            image: "ubuntu:24.04"
            slug: ubuntu24.04
          - name: Ubuntu 26.04
            image: "ubuntu:26.04"
            slug: ubuntu26.04
          - name: Debian 11
            image: "debian:11"
            slug: debian11
          - name: Debian 12
            image: "debian:12"
            slug: debian12
          - name: Debian 13
            image: "debian:13"
            slug: debian13

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)"
          fi
          VERSION="${VERSION#v}"
          VERSION="$(printf '%s' "$VERSION" | sed 's/[^0-9A-Za-z.+~:-]/+/g')"
          if [[ ! "$VERSION" =~ ^[0-9] ]]; then
            VERSION="0.0.0+git.$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "${{ matrix.image }}" \
            sh /work/scripts/build-deb.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ matrix.slug }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: json-graylog-tcp-logger-${{ matrix.slug }}
          path: json-graylog-tcp-logger_*_${{ matrix.slug }}_*.deb
          if-no-files-found: error

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            json-graylog-tcp-logger_*_${{ matrix.slug }}_*.deb \
            --clobber
