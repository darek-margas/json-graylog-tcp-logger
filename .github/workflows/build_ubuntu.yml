name: Build packages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 20.04
            image: "ubuntu:20.04"
            slug: ubuntu20.04
          - name: Ubuntu 22.04
            image: "ubuntu:22.04"
            slug: ubuntu22.04
          - name: Ubuntu 24.04
            image: "ubuntu:24.04"
            slug: ubuntu24.04
          - name: Ubuntu 26.04
            image: "ubuntu:26.04"
            slug: ubuntu26.04
          - name: Debian 11
            image: "gcc:10-bullseye"
            slug: debian11
          - name: Debian 12
            image: "debian:12"
            slug: debian12
          - name: Debian 13
            image: "debian:13"
            slug: debian13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package
        shell: bash
        run: |
          docker run --rm             -v "$GITHUB_WORKSPACE:/work"             -w /work             "${{ matrix.image }}"             sh /work/scripts/build-deb.sh             "${{ steps.version.outputs.version }}"             "${{ matrix.slug }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: json-graylog-tcp-logger-${{ matrix.slug }}
          path: json-graylog-tcp-logger_*_${{ matrix.slug }}_*.deb
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: json-graylog-tcp-logger-*
          merge-multiple: true
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ls -l release
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" release/*.deb --clobber
          else
            gh release create "$VERSION"               --target "$GITHUB_SHA"               --title "$VERSION"               --generate-notes               release/*.deb
          fi
